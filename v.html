<uiView
onLoad="
var printDigit = function(d) {
  return String(Math.floor(d));
};

var mode = 'hour';
var color = '';
var white = '#FFFFFF';
var black = '#000000';
var weak = '#AAAAAA';
var digitStyle = 0;
var coreColors = [white, black, weak, black];
var outlineColors = [black, white, black, weak];

var applyDigitStyle = function(ds) {
  setStyle('#m_10_core', 'color', coreColors[ds]);
  setStyle('#m_01_core', 'color', coreColors[ds]);
  setStyle('#minutes', 'color', outlineColors[ds]);
};

$.subscribe('/Zapp/{zapp_index}/Output/color', function (c) {
  color = '#' + (c + 0x1000000).toString(16).slice(1);
});

$.subscribe('/Zapp/{zapp_index}/Output/digitStyle', function (ds) {
  digitStyle = ds;
});

$.subscribe('/Dev/Time/LocalTime/Min', function (sec) {
  var min = parseInt((sec % (24 * 3600)) / 60, 10);
  $.put('/Zapp/{zapp_index}/Event', 1000 + min , null, 'int32');
});

var interval = setInterval(function() {
  if (mode == 'hour') {
    setStyle('#d', 'color', black);
  } else {
    setStyle('#m_10_core', 'color', black);
    setStyle('#m_01_core', 'color', black);
    setStyle('#minutes', 'color', black);
  }

  setTimeout(function() {
    setStyle('#d', 'color', color);
    applyDigitStyle(digitStyle);
  }, 500);
}, 1000);

var callEvent = function(eventId) {
  $.put('/Zapp/{zapp_index}/Event', eventId, null, 'int32');
  clearInterval(interval);
};
"
>
  <div
    class="sp-d-xxl sp-vertical-center"
    id="d"
    style="position: absolute; top: 0; left: 0; height: 100%; width: 50%;color:black"
  >
    <div style="position:absolute;left:20%;top:calc(50% - 55%e);width:80%;height:40%;" id="hd0">
      <eval input="/Zapp/{zapp_index}/Output/hour_10" outputFormat="script x => printDigit(x)" />
    </div>

    <div style="left:60%;top:calc(50% - 55%e);width:40%;height:40%;" id="hd1">
      <eval input="/Zapp/{zapp_index}/Output/hour_01" outputFormat="script x => printDigit(x)" />
    </div>
  </div>

  <div
    style="position:absolute;top:0;left:50%;height:100%;width:50%;color:black;"
    id="minutes"
    class="sp-d-xxl sp-vertical-center"
  >
    <div style="position:absolute;left:6%;top:30%;width:40%;height:40%;" id="m_10">
      <div style="position:absolute;height:100%;top:calc(50% - 55%e - 1px);left:-1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_10" outputFormat="script x => printDigit(x)" />
      </div>
      <div style="position:absolute;height:100%;top:calc(50% - 55%e + 1px);left:1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_10" outputFormat="script x => printDigit(x)" />
      </div>
      <div style="position:absolute;height:100%;top:calc(50% - 55%e - 1px);left:1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_10" outputFormat="script x => printDigit(x)" />
      </div>
      <div style="position:absolute;height:100%;top:calc(50% - 55%e + 1px);left:-1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_10" outputFormat="script x => printDigit(x)" />
      </div>

      <div style="position:absolute;height:100%;top:calc(50% - 55%e);left:0;" id="m_10_core">
        <eval input="/Zapp/{zapp_index}/Output/minute_10" outputFormat="script x => printDigit(x)" />
      </div>
    </div>
    
    <div style="position:absolute;left:46%;top:30%;width:40%;height:40%;" id="m_01">
      <div style="position:absolute;height:100%;top:calc(50% - 55%e - 1px);left:-1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_01" outputFormat="script x => printDigit(x)" />
      </div>
      <div style="position:absolute;height:100%;top:calc(50% - 55%e + 1px);left:1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_01" outputFormat="script x => printDigit(x)" />
      </div>
      <div style="position:absolute;height:100%;top:calc(50% - 55%e - 1px);left:1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_01" outputFormat="script x => printDigit(x)" />
      </div>
      <div style="position:absolute;height:100%;top:calc(50% - 55%e + 1px);left:-1px;">
        <eval input="/Zapp/{zapp_index}/Output/minute_01" outputFormat="script x => printDigit(x)" />
      </div>

      <div style="position:absolute;height:100%;top:calc(50% - 55%e);left:0;" id="m_01_core">
        <eval input="/Zapp/{zapp_index}/Output/minute_01" outputFormat="script x => printDigit(x)" />
      </div>
    </div>
  </div>

  <userInput>
    <pushButton name="down" 
      onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
      onLongPressStart="callEvent(2);"
    />
    <pushButton name="next" 
      onClick="$.put('/Zapp/{zapp_index}/Event', 3, null, 'int32'); mode = mode == 'hour' ? 'minute' : 'hour'"
      onLongPressStart="callEvent(4);"
    />
    <pushButton name="up" 
      onClick="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');"
      onLongPressStart="callEvent(6);"
    />
  </userInput>

</uiView>
