<!-- WATCH FACE LOWPOWER : VERTICAL HERO -->
<uiView
  onLoad="
    var HOUR = '#hs1, #hs2, #ho1, #ho2';
    var MIN = '#ms1, #ms2, #mo1, #mo2';
    var hourFont = 0;
    var minuteFont = 0;
    var hourColor = '#FFFFFF';
    var minuteColor = '#FFFFFF';
    // Digits are shown only after time, fonts and colors are known, so they never appear in default look
    var ready = {};
    var pending = 5;
    function toHex(c) {
      return '#' + (c + 0x1000000).toString(16).slice(1);
    }
    function paint() {
      setStyle(HOUR, 'color', hourColor);
      setStyle(MIN, 'color', minuteColor);
    }
    function render() {
      if (pending > 0) { return; }
      setStyle('#hs1, #hs2', 'visibility', hourFont == 0 ? 'VISIBLE' : 'HIDDEN');
      setStyle('#ho1, #ho2', 'visibility', hourFont == 1 ? 'VISIBLE' : 'HIDDEN');
      setStyle('#ms1, #ms2', 'visibility', minuteFont == 0 ? 'VISIBLE' : 'HIDDEN');
      setStyle('#mo1, #mo2', 'visibility', minuteFont == 1 ? 'VISIBLE' : 'HIDDEN');
    }
    function setReady(key) {
      if (!ready[key]) {
        ready[key] = true;
        pending--;
      }
      render();
    }
    function customFontTime(t) {
      var d = formatValue(t, 'time HHmmss');
      var H = d[0], h = d[1];
      // Modify hours if user is using 12-hour time format
      if (!{SETTING_TIME_24H}) {
        var h12 = String((+d.substr(0, 2) % 12) || 12); // Convert from 24-hour to 12-hour format
        if (h12.length == 1) {
          h12 = '0' + h12; // Ensure we have 2 digit hours
        }
        H = h12.charAt(0);
        h = h12.charAt(1);
      }
      setStyle('#hs1, #ho1', 'left', (-100 * H) + '%');
      setStyle('#hs2, #ho2', 'left', (-100 * h) + '%');
      setStyle('#ms1, #mo1', 'left', (-100 * d[2]) + '%');
      setStyle('#ms2, #mo2', 'left', (-100 * d[3]) + '%');
      setReady('time');
    }
    "
  onActivate="
    $.subscribe('/Zapp/{zapp_index}/Output/hourFont', function(f) {hourFont = f; setReady('hf');});
    $.subscribe('/Zapp/{zapp_index}/Output/minuteFont', function(f) {minuteFont = f; setReady('mf');});
    $.subscribe('/Zapp/{zapp_index}/Output/hourColor', function(c) {
      hourColor = toHex(c);
      paint();
      setReady('hc');
    });
    $.subscribe('/Zapp/{zapp_index}/Output/minuteColor', function(c) {
      minuteColor = toHex(c);
      paint();
      setReady('mc');
    });
    // Fallback so the digits never stay hidden if some value does not arrive
    setTimeout(function() {pending = 0; render();}, 1000);
    $.get('/Dev/Time/LocalTime/Min', function(v) {customFontTime(v);}); // Avoid initial blinking
    $.subscribe('/Dev/Time/LocalTime/Min', function(v) {customFontTime(v);});
    ">

  <div id="content" style="width:100%;height:100%;">
    <!-- AM/PM 12H: small text right of the minutes, in the lower half of the digit row. Centered (92%) in the free
         space right of the digits (digit group ends at 83.3-84.3% on q, o and n), 13% wide so it never touches them -->
    <:if test="!{SETTING_TIME_24H}">
      <div class="sp-t-s" style="left:calc(92% - 50%e);top:calc(56% - 50%e);width:13%;text-align:center;">
        <eval input="/Dev/Time/LocalTime/Min" outputFormat="time ?tt" />
      </div>
    </:if>

    <!-- MAIN TIME: 4 cells per display (q 80x110 px, o 48x66 px, n 40x56 px; s and m use n, l uses o), centered by percentage -->
    <!-- solid = solid.png, outline = outl.png, one row per display (top offset q 0, o -110px, n -176px); per digit only the selected font type is visible -->
    <:if test="('{{DISPLAY_ID}}' == 'q')">
      <div style="left:calc(50% - 50%e);top:calc(50% - 50%e);width:320px;height:110px;">
        <div style="left:0%;top:0%;width:80px;height:110px;overflow:hidden;"><img id="hs1" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho1" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:25%;top:0%;width:80px;height:110px;overflow:hidden;"><img id="hs2" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho2" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:50%;top:0%;width:80px;height:110px;overflow:hidden;"><img id="ms1" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo1" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:75%;top:0%;width:80px;height:110px;overflow:hidden;"><img id="ms2" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo2" style="position:absolute; top:0px; visibility:hidden;" class="t-base" src="outl.png" /></div>
      </div>
    </:if>
    <:elseif test="('{{DISPLAY_ID}}' == 'o')">
      <div style="left:calc(50% - 50%e);top:calc(50% - 50%e);width:192px;height:66px;">
        <div style="left:0%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="hs1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:25%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="hs2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:50%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="ms1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:75%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="ms2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
      </div>
    </:elseif>
    <:elseif test="('{{DISPLAY_ID}}' == 'l')">
      <div style="left:calc(50% - 50%e);top:calc(50% - 50%e);width:192px;height:66px;">
        <div style="left:0%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="hs1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:25%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="hs2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:50%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="ms1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo1" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:75%;top:0%;width:48px;height:66px;overflow:hidden;"><img id="ms2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo2" style="position:absolute; top:-110px; visibility:hidden;" class="t-base" src="outl.png" /></div>
      </div>
    </:elseif>
    <:else>
      <div style="left:calc(50% - 50%e);top:calc(50% - 50%e);width:160px;height:56px;">
        <div style="left:0%;top:0%;width:40px;height:56px;overflow:hidden;"><img id="hs1" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho1" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:25%;top:0%;width:40px;height:56px;overflow:hidden;"><img id="hs2" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="solid.png" /><img id="ho2" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:50%;top:0%;width:40px;height:56px;overflow:hidden;"><img id="ms1" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo1" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="outl.png" /></div>
        <div style="left:75%;top:0%;width:40px;height:56px;overflow:hidden;"><img id="ms2" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="solid.png" /><img id="mo2" style="position:absolute; top:-176px; visibility:hidden;" class="t-base" src="outl.png" /></div>
      </div>
    </:else>
  </div>
</uiView>
