<uiView
onLoad="
var printDigit = function(d) {
  return String(Math.floor(d));
};

$.subscribe('/Zapp/{zapp_index}/Output/color', function (c) {
  setStyle('#d', 'color', '#' + (c + 0x1000000).toString(16).slice(1));
});
"
>

  <div class="sp-d-xxl sp-vertical-center" id="d" style="color: red;">
    <div style="position:absolute;left: 10%;top:calc(50% - 55%e); width: 20%; height: 40%;" id="hd0">
      <eval input="/Dev/Time/LocalTime/Min" outputFormat="script x => printDigit((((x / 3600) % 24) / 10))"/>
    </div>

    <div style="left: 30%;top:calc(50% - 55%e); width: 20%; height: 40%;" id="hd1">
      <eval input="/Dev/Time/LocalTime/Min" outputFormat="script x => printDigit(((x / 3600) % 24) % 10)"/>
    </div>

    <div style="left: 53%;top:calc(50% - 55%e); width: 20%; height: 40%; color: white;" id="md0">
      <eval input="/Dev/Time/LocalTime/Min" outputFormat="script x => printDigit(((x / 60) % 60) / 10)" />
    </div>

    <div style="left: 73%;top:calc(50% - 55%e); width: 20%; height: 40%; color: white;" id="md1">
      <eval input="/Dev/Time/LocalTime/Min" outputFormat="script x => printDigit(((x / 60) % 60) % 10)"/>
    </div>
  </div>

  <userInput>
    <pushButton name="down" 
      onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
      onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');"
    />
  </userInput>

</uiView>
